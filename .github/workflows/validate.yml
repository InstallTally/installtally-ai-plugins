name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test the public archive
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/build_plugin.py --output dist/installtally-ai-plugin.zip
      - name: Test local private MCP, Apple bootstrap and version helpers
        run: node --test tests/*.test.mjs
      - name: Validate Claude plugin and marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.317 plugin validate .claude-plugin/plugin.json --strict --json
          npx --yes @anthropic-ai/claude-code@2.1.317 plugin validate .claude-plugin/marketplace.json --strict --json
